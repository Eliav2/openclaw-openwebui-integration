<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 720" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif">
  <defs>
    <linearGradient id="user" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#6366f1"/>
      <stop offset="100%" stop-color="#818cf8"/>
    </linearGradient>
    <linearGradient id="assistant" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#1e293b"/>
      <stop offset="100%" stop-color="#334155"/>
    </linearGradient>
    <linearGradient id="toolbar" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1e293b"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
    <linearGradient id="toolCall" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1e293b"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="900" height="720" fill="#0f172a" rx="12"/>

  <!-- Sidebar -->
  <rect x="0" y="0" width="240" height="720" fill="#0f172a" />
  <line x1="240" y1="0" x2="240" y2="720" stroke="#1e293b" stroke-width="1"/>

  <!-- Sidebar header -->
  <text x="20" y="38" fill="#e2e8f0" font-size="16" font-weight="700">Open WebUI</text>
  <rect x="20" y="52" width="200" height="32" rx="6" fill="#1e293b"/>
  <text x="32" y="73" fill="#64748b" font-size="13">🔍 Search conversations...</text>

  <!-- Sidebar items -->
  <rect x="12" y="96" width="216" height="36" rx="6" fill="#334155"/>
  <text x="24" y="119" fill="#e2e8f0" font-size="13">💬  OpenClaw Agents Test</text>
  <rect x="12" y="140" width="216" height="36" rx="6" fill="transparent"/>
  <text x="24" y="163" fill="#64748b" font-size="13">💬  General Chat</text>

  <!-- Main area -->
  <!-- Top bar -->
  <rect x="240" y="0" width="660" height="56" fill="#0f172a"/>
  <line x1="240" y1="56" x2="900" y2="56" stroke="#1e293b" stroke-width="1"/>

  <!-- Model selector -->
  <rect x="260" y="16" width="200" height="28" rx="14" fill="#334155"/>
  <text x="276" y="35" fill="#a5f3fc" font-size="12" font-weight="600">⬡  OpenClaw Gateway</text>
  <text x="444" y="35" fill="#64748b" font-size="11">▼</text>

  <!-- Chat area header -->
  <text x="270" y="45" fill="#94a3b8" font-size="11">OpenClaw Gateway · Active</text>

  <!-- Chat messages area -->
  <rect x="240" y="56" width="660" height="604" fill="#0f172a"/>

  <!-- MESSAGE 1: User -->
  <rect x="540" y="76" width="340" height="52" rx="12" fill="#6366f1"/>
  <text x="556" y="98" fill="#e0e7ff" font-size="13" font-weight="500">What's the weather in Tel Aviv right now?</text>
  <text x="556" y="116" fill="#a5b4fc" font-size="11">02:34 AM · 1m ago</text>

  <!-- MESSAGE 2: Assistant - Tool call status -->
  <rect x="260" y="148" width="280" height="34" rx="8" fill="#1e293b"/>
  <text x="276" y="170" fill="#94a3b8" font-size="13">🔧 Running  get_weather...</text>

  <!-- Tool call result: <details type="tool_calls"> -->
  <rect x="260" y="190" width="620" height="82" rx="8" fill="url(#toolCall)" stroke="#334155" stroke-width="1"/>
  <!-- Details header -->
  <rect x="260" y="190" width="620" height="32" rx="8" fill="#1e293b"/>
  <rect x="260" y="210" width="620" height="12" fill="#1e293b"/>
  <text x="280" y="211" fill="#38bdf8" font-size="13">▼  get_weather  ·  done  ✅</text>
  <!-- Arguments -->
  <text x="276" y="238" fill="#64748b" font-size="11">Arguments:</text>
  <text x="348" y="238" fill="#a1f4cf" font-family="monospace" font-size="11">{"location": "Tel Aviv, IL"}</text>
  <!-- Result -->
  <text x="276" y="256" fill="#64748b" font-size="11">Result:</text>
  <text x="328" y="256" fill="#e2e8f0" font-family="monospace" font-size="11">24°C · Clear skies · Humidity: 45%</text>

  <!-- MESSAGE 3: Assistant response text -->
  <rect x="260" y="284" width="540" height="82" rx="12" fill="url(#assistant)"/>
  <text x="276" y="308" fill="#e2e8f0" font-size="13">The weather in Tel Aviv right now is</text>
  <text x="276" y="328" fill="#e2e8f0" font-size="13">around **24°C** with **clear skies** and a</text>
  <text x="276" y="348" fill="#e2e8f0" font-size="13">humidity of 45%. Looks like a nice evening! 🌙</text>
  <text x="276" y="356" fill="#64748b" font-size="11">02:34 AM · just now</text>

  <!-- Typing indicator (cursor) -->
  <rect x="260" y="380" width="80" height="30" rx="12" fill="#1e293b"/>
  <circle cx="278" cy="395" r="4" fill="#38bdf8" opacity="0.8"/>
  <circle cx="290" cy="395" r="4" fill="#38bdf8" opacity="0.5"/>
  <circle cx="302" cy="395" r="4" fill="#38bdf8" opacity="0.3"/>

  <!-- Chat input area -->
  <rect x="240" y="660" width="660" height="60" fill="#0f172a"/>
  <line x1="240" y1="660" x2="900" y2="660" stroke="#1e293b" stroke-width="1"/>
  <rect x="256" y="670" width="580" height="36" rx="18" fill="#1e293b" stroke="#334155" stroke-width="1"/>
  <text x="276" y="693" fill="#475569" font-size="13">Type a message...</text>
  <circle cx="820" cy="688" r="14" fill="#6366f1"/>
  <text x="814" y="693" fill="white" font-size="14">↑</text>

  <!-- Bottom status bar -->
  <rect x="256" y="714" width="240" height="6" fill="transparent"/>
  <circle cx="262" cy="717" r="3" fill="#22c55e"/>
  <text x="270" y="720" fill="#64748b" font-size="10">Connected via WebSocket · Streaming</text>
</svg>
