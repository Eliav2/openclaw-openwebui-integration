# Web Push for an Open WebUI behind nginx (docs/install/web-push.md).
# Inside the server block that proxies Open WebUI. /srv/open-webui-push holds
# oc-sw.js and oc-push.js from push/web/, with the two placeholders in
# oc-push.js replaced. oc-push.js replaces Open WebUI's /static/loader.js,
# which is empty unless you put something there; if you did, append it to
# oc-push.js.
location = /oc-sw.js {
    alias /srv/open-webui-push/oc-sw.js;
    default_type text/javascript;
    add_header Cache-Control "no-cache";
    add_header Service-Worker-Allowed "/";
}
location = /static/loader.js {
    alias /srv/open-webui-push/oc-push.js;
    default_type text/javascript;
    add_header Cache-Control "no-cache";
}
