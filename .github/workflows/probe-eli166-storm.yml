name: Probe ELI-166 storm
# Throwaway (ELI-166 item d): the ELI-115 reconnect storm on 0.12.0 vs 0.12.3.
on:
  push:
    branches: [probe/eli166-storm]
permissions:
  contents: read
jobs:
  storm:
    name: storm (${{ matrix.owui }} rep ${{ matrix.rep }})
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        owui: ["v0.12.0", "v0.12.3"]
        rep: [1, 2]
    steps:
      - uses: actions/checkout@v7
      - name: Start the stack and install the integration
        uses: ./.github/actions/stack
        with:
          log_dir: ${{ runner.temp }}/logs
          owui_image: ghcr.io/open-webui/open-webui:${{ matrix.owui }}
      - name: Install Chromium for Playwright
        run: uv run --with-requirements requirements-browser.txt python -m playwright install --with-deps chromium
      - name: Storm
        env:
          OUT: ${{ runner.temp }}/storm-${{ matrix.owui }}-${{ matrix.rep }}.json
        run: uv run --with-requirements requirements-browser.txt python probe166/storm_probe.py
      - name: Open WebUI log
        if: always()
        run: |
          docker logs owui > "$RUNNER_TEMP/logs/open-webui-after.log" 2>&1 || true
          grep -c "Session not found\|KeyError" "$RUNNER_TEMP/logs/open-webui-after.log" || true
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: storm-${{ matrix.owui }}-${{ matrix.rep }}
          path: |
            ${{ runner.temp }}/storm-${{ matrix.owui }}-${{ matrix.rep }}.json
            ${{ runner.temp }}/logs/open-webui-after.log
