name: Probe ELI-115 memory

# Throwaway probe (branch probe/eli115-memory only): a replay of
# 2026-10-16 07:12Z (status writes on and off) and the socket storm; then the
# fixes measured through the real Pipe (pipe-replay): the same harness
# (probe115/pipe_replay.py, from this branch) against the Pipe installed from
# main, main + fix 1, + fix 2, + fix 3 (the PR head).

on:
  push:
    branches: ["probe/eli115-memory"]

permissions:
  contents: read

jobs:
  probe:
    if: false
    name: probe (${{ matrix.variant }})
    runs-on: ubuntu-latest
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        include:
          - variant: default
            env: ""
          - variant: cache2mb
            env: "-e DATABASE_SQLITE_PRAGMA_CACHE_SIZE=-2000"
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.3.0
      - name: Open WebUI
        run: |
          source e2e/versions.env
          docker run -d --name owui --network host ${{ matrix.env }} \
            -e WEBUI_SECRET_KEY=probe-$(openssl rand -hex 8) -e ENABLE_OLLAMA_API=false \
            -e ENABLE_OPENAI_API=false -e OFFLINE_MODE=true "$OWUI_IMAGE"
          for i in $(seq 150); do curl -fsS localhost:8080/health && break; sleep 2; done
          curl -fsS -X POST localhost:8080/api/v1/auths/signup -H 'Content-Type: application/json' \
            -d '{"name":"probe","email":"probe@example.com","password":"probe-pass-1"}' >/dev/null
          docker exec owui sh -c 'grep -rn "SQLITE_PRAGMA_CACHE_SIZE\|DATABASE_POOL_SIZE" /app/backend/open_webui/env.py | head -5'
      - name: Probe
        env:
          OWUI_EMAIL: probe@example.com
          OWUI_PASSWORD: probe-pass-1
          OUT: ${{ runner.temp }}/probe-${{ matrix.variant }}.jsonl
        run: uv run --with httpx python probe115/driver.py
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: probe-${{ matrix.variant }}
          path: ${{ runner.temp }}/probe-${{ matrix.variant }}.jsonl

  replay:
    if: false
    name: replay (${{ matrix.mode }} ${{ matrix.malloc }})
    runs-on: ubuntu-latest
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        mode: [today]
        malloc: [default, mmap128k]
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.3.0
      - name: Open WebUI (one CPU, nearer the Pi)
        run: |
          source e2e/versions.env
          [ "${{ matrix.malloc }}" = mmap128k ] && M="-e MALLOC_MMAP_THRESHOLD_=131072" || M=""
          docker run -d --name owui --network host --cpus=1 $M \
            -e WEBUI_SECRET_KEY=probe-$(openssl rand -hex 8) -e ENABLE_OLLAMA_API=false \
            -e ENABLE_OPENAI_API=false -e OFFLINE_MODE=true "$OWUI_IMAGE"
          for i in $(seq 150); do curl -fsS localhost:8080/health && break; sleep 2; done
          curl -fsS -X POST localhost:8080/api/v1/auths/signup -H 'Content-Type: application/json' \
            -d '{"name":"probe","email":"probe@example.com","password":"probe-pass-1"}' >/dev/null
      - name: Replay
        env:
          OWUI_EMAIL: probe@example.com
          OWUI_PASSWORD: probe-pass-1
          MODE: ${{ matrix.mode }}
          OUT: ${{ runner.temp }}/replay-${{ matrix.mode }}-${{ matrix.malloc }}.jsonl
        run: uv run --with httpx python probe115/replay.py
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: replay-${{ matrix.mode }}-${{ matrix.malloc }}
          path: ${{ runner.temp }}/replay-${{ matrix.mode }}-${{ matrix.malloc }}.jsonl

  storm:
    if: false
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.3.0
      - name: Open WebUI
        run: |
          source e2e/versions.env
          docker run -d --name owui --network host \
            -e WEBUI_SECRET_KEY=probe-$(openssl rand -hex 8) -e ENABLE_OLLAMA_API=false \
            -e ENABLE_OPENAI_API=false -e OFFLINE_MODE=true "$OWUI_IMAGE"
          for i in $(seq 150); do curl -fsS localhost:8080/health && break; sleep 2; done
          curl -fsS -X POST localhost:8080/api/v1/auths/signup -H 'Content-Type: application/json' \
            -d '{"name":"probe","email":"probe@example.com","password":"probe-pass-1"}' >/dev/null
      - name: Storm
        env:
          OWUI_EMAIL: probe@example.com
          OWUI_PASSWORD: probe-pass-1
          OUT: ${{ runner.temp }}/storm.jsonl
        run: uv run --with httpx --with "python-socketio[asyncio_client]" python probe115/storm.py
      - name: Session-not-found lines
        if: always()
        run: docker logs owui 2>&1 | grep -c "Session not found" || true
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: storm
          path: ${{ runner.temp }}/storm.jsonl

  pipe-replay:
    name: pipe replay (${{ matrix.variant }} rep ${{ matrix.rep }})
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        variant: [main, fix1, fix12, fix123]
        rep: [1, 2, 3, 4, 5]
    steps:
      - name: Ref under test
        id: ref
        run: |
          case "${{ matrix.variant }}" in
            main)   echo "sha=60aebaa267faaeeb98b608a22dd0e129f03feba3" >> "$GITHUB_OUTPUT" ;;
            fix1)   echo "sha=a9f1e0be7254e703b6ef52d87cef284f6f29aa60" >> "$GITHUB_OUTPUT" ;;
            fix12)  echo "sha=60d8973c10c6c57512795ac7a721e96568bf0255" >> "$GITHUB_OUTPUT" ;;
            fix123) echo "sha=9b29a595cfdb4462604ee8a3325f71a5aab199e7" >> "$GITHUB_OUTPUT" ;;
          esac
      - uses: actions/checkout@v7
        with:
          ref: ${{ steps.ref.outputs.sha }}
      - uses: actions/checkout@v7
        with:
          path: harness-src
      - name: The file the scene's tool calls read
        run: |
          mkdir -p "$HOME/.openclaw/workspace/replay"
          python3 -c "print(('replay notes line ' * 6 + '\\n') * 80, end='')" > "$HOME/.openclaw/workspace/replay/notes.txt"
          wc -c "$HOME/.openclaw/workspace/replay/notes.txt"
      - name: Start the stack and install the integration
        uses: ./.github/actions/stack
        env:
          FAKE_LLM_SCENES: ${{ github.workspace }}/harness-src/probe115/replay-scene.json
        with:
          log_dir: ${{ runner.temp }}/e2e-logs
      - name: Open WebUI on one CPU, nearer the Pi
        run: docker update --cpus=1 owui
      - name: Replay
        env:
          VARIANT: ${{ matrix.variant }}
          PAGE_SAVES: "0"
          REJOIN_S: "5"
          REF: ${{ steps.ref.outputs.sha }}
          REP: ${{ matrix.rep }}
          OUT: ${{ runner.temp }}/pipe-replay-${{ matrix.variant }}-${{ matrix.rep }}.jsonl
        run: uv run --with httpx --with "python-socketio[asyncio_client]" python harness-src/probe115/pipe_replay.py
      - name: Pipe lines
        if: always()
        run: |
          docker logs owui > "$RUNNER_TEMP/e2e-logs/open-webui.log" 2>&1 || true
          grep -c "turn writer: finalized" "$RUNNER_TEMP/e2e-logs/open-webui.log" || true
          grep -i "turn writer\|composer\|orphan" "$RUNNER_TEMP/e2e-logs/open-webui.log" | tail -40 || true
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: pipe-replay-${{ matrix.variant }}-${{ matrix.rep }}
          path: |
            ${{ runner.temp }}/pipe-replay-${{ matrix.variant }}-${{ matrix.rep }}.jsonl
            ${{ runner.temp }}/e2e-logs

  chat-size:
    name: chat size alone (rep ${{ matrix.rep }})
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        rep: [1, 2, 3]
    steps:
      - uses: actions/checkout@v7
        with:
          ref: 9b29a595cfdb4462604ee8a3325f71a5aab199e7
      - uses: actions/checkout@v7
        with:
          path: harness-src
      - name: Start the stack and install the integration
        uses: ./.github/actions/stack
        env:
          FAKE_LLM_SCENES: ${{ github.workspace }}/harness-src/probe115/replay-scene.json
        with:
          log_dir: ${{ runner.temp }}/e2e-logs
      - name: Open WebUI on one CPU, nearer the Pi
        run: docker update --cpus=1 owui
      - name: Single operations, each in a restarted Open WebUI
        env:
          REP: ${{ matrix.rep }}
          OUT: ${{ runner.temp }}/chat-size-${{ matrix.rep }}.jsonl
        run: uv run --with httpx --with "python-socketio[asyncio_client]" python harness-src/probe115/chat_size.py
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: chat-size-${{ matrix.rep }}
          path: ${{ runner.temp }}/chat-size-${{ matrix.rep }}.jsonl
