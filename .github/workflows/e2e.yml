name: E2E

# The full stack, real everywhere except the model: Open WebUI in Docker, this
# integration installed by its own installers, a real OpenClaw Gateway, and a
# deterministic fake model (e2e/fake_llm.py). Called by ci.yml (every push and
# PR) and compat-watch.yml (daily, against upstream's latest).

on:
  workflow_call:
    inputs:
      owui_image:
        description: Open WebUI image (empty = the pinned one in e2e/versions.env)
        type: string
        default: ""
      openclaw_version:
        description: npm spec for openclaw (empty = the pinned one in e2e/versions.env, "next" = OPENCLAW_NEXT_VERSION there)
        type: string
        default: ""
      lane:
        description: Name shown in the job title and artifact
        type: string
        default: pinned
  workflow_dispatch:
    inputs:
      owui_image:
        description: Open WebUI image (empty = pinned)
        type: string
        default: ""
      openclaw_version:
        description: npm spec for openclaw (empty = pinned)
        type: string
        default: ""
      lane:
        description: Lane name
        type: string
        default: manual
      tests:
        description: pytest -k expression for the end-to-end suite (empty = all; for repeating one test)
        type: string
        default: ""

permissions:
  contents: read

jobs:
  e2e:
    name: E2E (${{ inputs.lane }})
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      - name: Start the stack and install the integration
        uses: ./.github/actions/stack
        with:
          owui_image: ${{ inputs.owui_image }}
          openclaw_version: ${{ inputs.openclaw_version }}
          log_dir: ${{ runner.temp }}/e2e-logs

      - name: Lane summary
        env:
          LANE: ${{ inputs.lane }}
        run: |
          echo "### E2E lane \`$LANE\`: \`$OWUI_IMAGE\`, \`openclaw@$OPENCLAW_VERSION\`" >> "$GITHUB_STEP_SUMMARY"

      - name: End-to-end suite
        env:
          TESTS: ${{ inputs.tests }}
        run: |
          uv run --with-requirements requirements-dev.txt \
            pytest -v --junitxml="$RUNNER_TEMP/e2e-logs/junit.xml" e2e/test_e2e.py ${TESTS:+-k "$TESTS"} && rc=0 || rc=$?
          [ "$rc" -eq 0 ] || { [ -n "$TESTS" ] && [ "$rc" -eq 5 ]; }  # -k matched nothing here

      - name: Install Chromium for Playwright
        run: uv run --with-requirements requirements-browser.txt python -m playwright install --with-deps chromium

      - name: Browser flows (Playwright)
        # What the user sees, one test per flow (e2e/test_browser_flows.py).
        env:
          TESTS: ${{ inputs.tests }}
        run: |
          uv run --with-requirements requirements-dev.txt --with-requirements requirements-browser.txt \
            pytest -v --junitxml="$RUNNER_TEMP/e2e-logs/junit-browser.xml" e2e/test_browser_flows.py ${TESTS:+-k "$TESTS"} && rc=0 || rc=$?
          [ "$rc" -eq 0 ] || { [ -n "$TESTS" ] && [ "$rc" -eq 5 ]; }  # -k matched nothing here

      - name: Fixtures still match the installed OpenClaw
        # The unit suite pins two Gateway source lines the Pipe matches on
        # (the claude-cli exit error, the cron wake prompt). With OPENCLAW_DIST
        # set these checks fail rather than skip when the dist is missing.
        run: |
          OPENCLAW_DIST="$(npm root -g)/openclaw/dist" uv run --with-requirements requirements-dev.txt \
            pytest -v -rs test_pipe_unit.py -k "installed_dist"

      - name: Collect logs
        if: always()
        run: |
          mkdir -p "$RUNNER_TEMP/e2e-logs"
          docker logs owui > "$RUNNER_TEMP/e2e-logs/open-webui.log" 2>&1 || true
          cp /tmp/openclaw/*.log "$RUNNER_TEMP/e2e-logs/" 2>/dev/null || true
          echo "--- gateway (tail)"; tail -40 "$RUNNER_TEMP/e2e-logs/gateway.log" 2>/dev/null || true
          echo "--- open webui (pipe lines)"; grep -i "openclaw\|pipe" "$RUNNER_TEMP/e2e-logs/open-webui.log" | tail -60 || true

      - name: Upload logs
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: e2e-logs-${{ inputs.lane }}
          path: ${{ runner.temp }}/e2e-logs
          retention-days: 14
