name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  packages: read  # pull the Open WebUI image from ghcr.io authenticated (.github/actions/stack)

concurrency:
  # One run per PR/branch; a new push cancels the stale run. Pushes to main
  # are never cancelled, so every merge gets a complete record.
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7

      - uses: astral-sh/setup-uv@v10.3.3

      - name: Ruff (correctness rules, see ruff.toml)
        run: uvx ruff@0.17.0 check --output-format github .

      - name: No new magic numbers or strings (Python, baseline in scripts/magic-baseline.json)
        run: python3 scripts/magic_baseline.py

      - uses: oven-sh/setup-bun@v2

      - name: No new magic numbers or strings (JS and TS, baseline in scripts/lint-js)
        run: scripts/lint-js/run.sh

      - name: Shell scripts
        run: shellcheck e2e/*.sh scripts/screenshots/*.sh

      - name: Workflows (actionlint)
        run: |
          bash <(curl -fsSL https://raw.githubusercontent.com/rhysd/actionlint/v1.7.12/scripts/download-actionlint.bash) 1.7.12
          ./actionlint -color

      - name: Gateway plugin parses
        run: |
          for f in gateway-plugins/*/index.js e2e/agent-tool/index.js; do node --check "$f" && echo "ok $f"; done
          for f in gateway-plugins/*/*.json e2e/agent-tool/*.json; do python3 -m json.tool "$f" >/dev/null && echo "ok $f"; done
          node --test gateway-plugins/*/*.test.js

  test:
    name: Unit (py${{ matrix.python-version }})
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        # 3.10 is the floor install.py declares; 3.11 is what Open WebUI ships
        # (and the version coverage is reported on); 3.13 is what a user
        # running install.py on a current distro will most likely have.
        python-version: ["3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}

      - uses: astral-sh/setup-uv@v10.3.3

      # Runs the vendored Open WebUI frontend reducer for the live-order tests.
      - uses: oven-sh/setup-bun@v2

      - name: Install dependencies
        run: uv pip install --system -r requirements-dev.txt

      - name: Drift guard (every distributed artifact)
        # The artifacts are committed because Open WebUI installs a single
        # flat file, so they must never fall behind src/. A shared fragment
        # feeds several artifacts, hence --check-all.
        run: python3 build.py --check-all

      - name: Unit tests
        # e2e/ and the installed-dist fixture checks skip themselves here (no
        # stack, no OpenClaw); the E2E job runs both.
        env:
          PY: ${{ matrix.python-version }}
        run: |
          if [ "$PY" = "3.11" ]; then
            pytest -q --cov=. --cov-report=term --cov-report=markdown:"$RUNNER_TEMP/cov.md"
            { echo "### Unit test coverage (py3.11)"; cat "$RUNNER_TEMP/cov.md"; } >> "$GITHUB_STEP_SUMMARY"
          else
            pytest -q
          fi

      - name: Artifacts load under Open WebUI's plugin loader
        run: python3 scripts/check_artifacts_load.py

  owui-fixture:
    name: OWUI handler fixture is current
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
      - name: Vendored handler matches the pinned and the next Open WebUI
        # The tool-card tests are only as true as this copy of upstream's code.
        run: |
          set -a; . e2e/versions.env; set +a
          # The copy the tests run against the pin; the next release against
          # its own _v<tag> copy, or that same copy when it did not change.
          python3 scripts/check_owui_fixture.py --ref "$OWUI_REF" --copy pinned
          python3 scripts/check_owui_frontend_fixture.py --ref "$OWUI_REF" --copy pinned
          if [ -n "${OWUI_NEXT_REF:-}" ]; then
            python3 scripts/check_owui_fixture.py --ref "$OWUI_NEXT_REF" --copy next
            python3 scripts/check_owui_frontend_fixture.py --ref "$OWUI_NEXT_REF" --copy next
          fi

  secrets:
    name: Secret scan
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: gitleaks (full history)
        # The whole history, every run: it takes about a second, and a
        # credential that once reached a public repo is leaked no matter which
        # commit removed it. This is a public repo.
        run: |
          curl -fsSL https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz \
            | tar -xz gitleaks
          ./gitleaks git --redact --verbose .

  scope:
    # Whether the PR can change what runs. A docs, Markdown, tests/ or
    # comments-and-docstrings-only PR skips the E2E lanes (12 jobs of about 8
    # minutes before this gate); everything else, and every push to main, runs
    # them. Nothing requires an E2E check to merge, so a skipped lane is no
    # blocker (scripts/ci_scope.py has the rule).
    name: Runtime scope
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      runtime: ${{ steps.scope.outputs.runtime }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - id: scope
        env:
          EVENT: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: python3 scripts/ci_scope.py "$EVENT" "$BASE_SHA" "$HEAD_SHA" | tee -a "$GITHUB_OUTPUT"

  e2e:
    # What the live install runs (e2e/versions.env): OpenClaw and Open WebUI.
    name: E2E
    needs: [lint, test, scope]
    if: needs.scope.outputs.runtime == 'true'
    uses: ./.github/workflows/e2e.yml
    with:
      lane: pinned

  e2e-oldest:
    # The oldest OpenClaw release still supported (OPENCLAW_OLDEST_VERSION in
    # e2e/versions.env), on the pinned Open WebUI. Reports, never blocks: a red
    # lane is a fact about that release, not about the PR. Remove it when the
    # documented minimum moves up (ELI-356).
    name: E2E oldest
    needs: [lint, test, scope]
    if: needs.scope.outputs.runtime == 'true'
    uses: ./.github/workflows/e2e.yml
    with:
      lane: oldest
      openclaw_version: oldest
      blocking: "false"
