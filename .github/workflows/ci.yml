name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # 3.10 is the floor install.py declares; 3.11 is what Open WebUI ships.
        python-version: ["3.10", "3.11", "3.12"]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pytest pydantic websockets cryptography click rich

      - name: Drift guard (both distributed artifacts)
        # The artifacts are committed because OWUI installs a single flat file,
        # so they must never fall behind src/. Checks the Pipe AND the Action --
        # a shared fragment feeds both.
        run: python3 build.py --check-all

      - name: Run tests
        # Integration suites skip themselves unless OWUI_EMAIL/OWUI_PASSWORD
        # point at a live Open WebUI, so this is unit-only on CI.
        run: pytest -q

      - name: Artifacts load under Open WebUI's plugin loader
        # OWUI execs the flat file into a module and introspects a top-level
        # Pipe/Action class. Catches an artifact that imports or instantiates
        # cleanly in src/ but not as a standalone single file.
        run: |
          python3 - <<'PY'
          import sys, types
          for name, path, cls in (
              ("openclaw_pipe", "openclaw_pipe.py", "Pipe"),
              ("openclaw_status_action", "openclaw_status_action.py", "Action"),
          ):
              mod = types.ModuleType(name)
              sys.modules[name] = mod
              exec(compile(open(path).read(), path, "exec"), mod.__dict__)
              assert hasattr(mod, cls), f"{path}: no top-level {cls}"
              getattr(mod, cls)()
              print(f"{path}: {cls} loaded and instantiated")
          PY
