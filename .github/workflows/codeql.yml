name: CodeQL

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "41 3 * * 1"  # weekly, picks up new queries without a code change

permissions:
  contents: read

jobs:
  analyze:
    name: Analyze (${{ matrix.language }})
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      security-events: write
    strategy:
      fail-fast: false
      matrix:
        language: [python, javascript-typescript, actions]
    steps:
      - uses: actions/checkout@v7
      - uses: github/codeql-action/init@v4
        with:
          languages: ${{ matrix.language }}
          # src/ fragments are analysed through the built artifacts, which are
          # the code Open WebUI actually runs. The test_fixture_owui_* files are
          # verbatim Open WebUI source, not ours.
          config: |
            paths-ignore:
              - src/openclaw_pipe_pkg
              - test_fixture_owui_streaming_handler.py
              - test_fixture_owui_structured_output.ts
      - uses: github/codeql-action/analyze@v4
        with:
          category: /language:${{ matrix.language }}
