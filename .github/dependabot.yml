version: 2
updates:
  - package-ecosystem: github-actions
    directories: ["/", "/.github/actions/*"]
    schedule:
      interval: weekly
    groups:
      actions:
        patterns: ["*"]

  # Test tooling only. pydantic, cryptography and websockets are pinned to
  # what Open WebUI locks and move with e2e/versions.env, not on their own.
  - package-ecosystem: pip
    directory: /
    schedule:
      interval: weekly
    ignore:
      - dependency-name: pydantic
      - dependency-name: cryptography
      - dependency-name: websockets
      # Unit tests run on Python 3.10, the floor install.py declares
      # (ci.yml); Pillow 13 needs 3.11, so its floor stays below 13.
      - dependency-name: pillow
        update-types: ["version-update:semver-major"]
    groups:
      test-tooling:
        patterns: ["*"]
