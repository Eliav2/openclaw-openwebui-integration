name: Start the stack
description: >-
  Open WebUI in Docker, a real OpenClaw Gateway and the fake model, with this
  integration installed by its own installers (e2e/start_stack.sh). Used by the
  E2E and Screenshots workflows. STACK_* and FAKE_LLM_* variables reach the
  stack from the calling step's env.

inputs:
  owui_image:
    description: Open WebUI image (empty = the pinned one in e2e/versions.env, "next" = OWUI_NEXT_IMAGE there, which exists only while a release is being moved to)
    default: ""
  openclaw_version:
    description: npm spec for openclaw (empty = the pinned one in e2e/versions.env, "oldest" = OPENCLAW_OLDEST_VERSION there, "next" = OPENCLAW_NEXT_VERSION there, which exists only while a release is being moved to)
    default: ""
  log_dir:
    description: Where the stack writes its logs
    required: true

runs:
  using: composite
  steps:
    - name: Resolve versions
      shell: bash
      env:
        IN_OWUI_IMAGE: ${{ inputs.owui_image }}
        IN_OPENCLAW_VERSION: ${{ inputs.openclaw_version }}
      run: |
        set -a; . e2e/versions.env; set +a
        # A named lane whose pin is not in versions.env fails here, instead of
        # silently running the pinned versions under another name.
        case "$IN_OPENCLAW_VERSION" in
          oldest) IN_OPENCLAW_VERSION=${OPENCLAW_OLDEST_VERSION:?no OPENCLAW_OLDEST_VERSION in e2e/versions.env} ;;
          next) IN_OPENCLAW_VERSION=${OPENCLAW_NEXT_VERSION:?no OPENCLAW_NEXT_VERSION in e2e/versions.env} ;;
        esac
        if [ "$IN_OWUI_IMAGE" = next ]; then IN_OWUI_IMAGE=${OWUI_NEXT_IMAGE:?no OWUI_NEXT_IMAGE in e2e/versions.env}; fi
        echo "OWUI_IMAGE=${IN_OWUI_IMAGE:-$OWUI_IMAGE}" >> "$GITHUB_ENV"
        echo "OPENCLAW_VERSION=${IN_OPENCLAW_VERSION:-$OPENCLAW_VERSION}" >> "$GITHUB_ENV"
        echo "Open WebUI: ${IN_OWUI_IMAGE:-$OWUI_IMAGE} / OpenClaw: openclaw@${IN_OPENCLAW_VERSION:-$OPENCLAW_VERSION}"

    # The Node range comes from the openclaw package being installed (its
    # engines.node), so a release that raises it doesn't break the stack. The
    # runner's own Node only runs `npm view` here.
    - name: Resolve the Node range openclaw needs
      id: node
      shell: bash
      run: |
        range=$(npm view "openclaw@$OPENCLAW_VERSION" engines.node)
        [ -n "$range" ] || { echo "openclaw@$OPENCLAW_VERSION declares no engines.node"; exit 1; }
        echo "openclaw@$OPENCLAW_VERSION needs Node $range"
        echo "range=$range" >> "$GITHUB_OUTPUT"

    # The newest Node in the range, not whichever one the runner image happens
    # to ship: resolved from nodejs.org's release index with npm's own semver,
    # then that exact build comes from the Actions cache. setup-node with
    # check-latest downloaded it from github.com/actions/node-versions releases
    # in every E2E job, the same per-run download that returned 504s elsewhere.
    - name: Resolve the newest Node in that range
      id: nodever
      shell: bash
      env:
        RANGE: ${{ steps.node.outputs.range }}
      run: |
        # npm's own copy of semver (npm/bin/npm-cli.js -> npm/node_modules/semver).
        semver="$(dirname "$(readlink -f "$(command -v npm)")")/../node_modules/semver"
        v=$(curl -fsSL https://nodejs.org/dist/index.json | node -e '
          const semver = require(process.argv[1])
          const all = JSON.parse(require("fs").readFileSync(0, "utf8")).map((r) => r.version)
          const v = semver.maxSatisfying(all, process.argv[2])
          if (!v) process.exit(1)
          console.log(v.replace(/^v/, ""))
        ' "$semver" "$RANGE")
        echo "Node $v (newest in $RANGE)"
        echo "version=$v" >> "$GITHUB_OUTPUT"

    - name: Cache Node ${{ steps.nodever.outputs.version }}
      uses: actions/cache@v6
      with:
        path: ${{ runner.tool_cache }}/node/${{ steps.nodever.outputs.version }}
        key: node-${{ runner.os }}-${{ runner.arch }}-${{ steps.nodever.outputs.version }}

    # An exact version already in the tool cache is used without a download.
    - uses: actions/setup-node@v7
      with:
        node-version: ${{ steps.nodever.outputs.version }}

    # npm's download cache for the openclaw install, keyed on the exact version
    # (e2e/versions.env; a calendar version, 2026.x). A moving spec such as
    # `latest` is never cached, so the compat watch always installs what npm
    # serves today.
    - name: Cache the openclaw download
      if: ${{ startsWith(env.OPENCLAW_VERSION, '2') }}
      uses: actions/cache@v6
      with:
        path: ~/.npm
        key: npm-openclaw-${{ runner.os }}-${{ env.OPENCLAW_VERSION }}

    # Anonymous pulls from ghcr.io share a rate limit across the runners'
    # addresses, and one hit fails the job ("toomanyrequests" pulling the
    # pinned image, main run 41043447904). An authenticated pull is counted
    # per account. The job's own token is enough for a public image; the
    # calling workflow grants `packages: read`.
    - name: Log in to ghcr.io
      if: ${{ startsWith(env.OWUI_IMAGE, 'ghcr.io/') }}
      shell: bash
      env:
        TOKEN: ${{ github.token }}
        ACTOR: ${{ github.actor }}
      run: |
        printf '%s' "$TOKEN" | docker login ghcr.io -u "$ACTOR" --password-stdin \
          || echo "::warning::docker login ghcr.io failed; pulling $OWUI_IMAGE anonymously"

    - uses: actions/setup-python@v7
      with:
        python-version: "3.11"

    - uses: ./.github/actions/tools
      with:
        uv: "true"

    - name: Start the stack and install the integration
      shell: bash
      env:
        E2E_LOG_DIR: ${{ inputs.log_dir }}
      run: bash e2e/start_stack.sh
